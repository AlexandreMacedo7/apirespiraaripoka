name: CI

on:
  push:
    branches: [ teste ]
  pull_request:
    branches: [ teste ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Pegar o código do repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # Passo 2: Configurar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Passo 3: Build (compilação do projeto)
      - name: Build do projeto
        run: mvn clean compile

      # Passo 4: Rodar testes
      - name: Rodar testes
        run: mvn test

      # Passo 5: Gerar relatório de cobertura
      - name: Gerar cobertura de testes
        run: mvn jacoco:report

      # Passo 6: Instalar artefato local (opcional)
      - name: Instalar artefato local
        run: mvn install
